services:

  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      SA_PASSWORD: ${SA_PASSWORD}
      ACCEPT_EULA: "Y"
    ports:
      - "1433:1433"
    volumes:
      - sqldata:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P '${SA_PASSWORD}' -Q 'SELECT 1' -No"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./AnomalyDetectionBackend
      dockerfile: Dockerfile
    ports:
      - "5165:5165"
    environment:
      DB_CONNECTION: ${DB_CONNECTION}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ISSUER: ${JWT_ISSUER}
      JWT_AUDIENCE: ${JWT_AUDIENCE}
      JWT_EXPIRATION_HOURS: ${JWT_EXPIRATION_HOURS}
      ASPNETCORE_ENVIRONMENT: "Production"
    volumes:
      - ./AnomalyDetectionBackend/AnomalyDetection.Api/PatchCore:/app/PatchCore
      - ./AnomalyDetectionBackend/AnomalyDetection.Api/Router:/app/Router
      - ./AnomalyDetectionBackend/AnomalyDetection.Api/FeedbackImages:/app/FeedbackImages
      - backend_logs:/app/Logs
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./anomaly-frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:5165
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  sqldata:
  backend_logs: